  <!--
    ════════════════════════════════════════════════════════════════════
    STEP 1  Define window.dataLayer and gtag exactly once, globally.
            Must execute before any consent or measurement command.
    ════════════════════════════════════════════════════════════════════
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    // Dev diagnostics — localhost / 127.0.0.1 only.
    var _DEV = (
      window.location.hostname === 'localhost' ||
      window.location.hostname === '127.0.0.1'
    );

    /*
      STEP 2  Restore any previously stored consent choice from localStorage.
              Reading this before setting the default lets us decide whether
              wait_for_update is needed and log the restored state.
    */
    var _storedConsent = null;
    try { _storedConsent = localStorage.getItem('fertilite_cookie_consent'); }
    catch (e) {}

    if (_DEV) {
      console.log(
        '[Tracking] Restored consent from localStorage:',
        _storedConsent || 'none (new visitor)'
      );
    }

    /*
      STEP 3  Set Consent Mode v2 default — denied for all parameters.
              Must run before gtag.js loads so it operates in advanced mode.

              wait_for_update:
                - New visitors: 500 ms. The consent banner is a genuine
                  async component (1 s setTimeout). 500 ms gives returning
                  visitors' synchronous update a chance to land; it does
                  not help new-visitor clicks (those always arrive after
                  the timer expires) but satisfies the advanced-mode spec.
                - Returning visitors: omitted. Their consent update is
                  restored synchronously below, before gtag.js fires.
    */
    var _defaultConsent = {
      analytics_storage:  'denied',
      ad_storage:         'denied',
      ad_user_data:       'denied',
      ad_personalization: 'denied'
    };
    if (!_storedConsent) {
      _defaultConsent.wait_for_update = 500;
    }

    gtag('consent', 'default', _defaultConsent);

    if (_DEV) {
      console.log(
        '[Tracking] gtag consent default set → denied (all).',
        _storedConsent ? 'No wait_for_update (returning visitor).' : 'wait_for_update: 500 ms (new visitor).'
      );
    }

    /*
      STEP 4  Restore stored consent synchronously for returning visitors.
              Runs before the gtag.js script fires any hit, so no
              wait_for_update is needed for these users.

              Both 'accepted' and 'declined' are explicitly signalled:
              - 'accepted' → grants all four parameters.
              - 'declined' → explicitly denies all four parameters.
                This distinguishes a confirmed user refusal from the
                ambiguous "not yet decided" default state, which matters
                for Consent Mode v2 advanced-mode modelling.
    */
    if (_storedConsent === 'accepted') {
      gtag('consent', 'update', {
        analytics_storage:  'granted',
        ad_storage:         'granted',
        ad_user_data:       'granted',
        ad_personalization: 'granted'
      });
      if (_DEV) {
        console.log('[Tracking] gtag consent update → granted (restored for returning visitor)');
      }
    } else if (_storedConsent === 'declined') {
      gtag('consent', 'update', {
        analytics_storage:  'denied',
        ad_storage:         'denied',
        ad_user_data:       'denied',
        ad_personalization: 'denied'
      });
      if (_DEV) {
        console.log('[Tracking] gtag consent update → denied (restored for returning visitor who declined)');
      }
    }
  </script>

  <!--
    STEP 5  Load Google tag while consent is denied so Consent Mode v2
            operates in advanced mode (cookieless pings / possible modelling).
            send_page_view: false on G-8X7FFQRYJS prevents an automatic
            page_view on load; the Analytics React component fires all
            page_view events so every SPA route change is tracked correctly.
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-699207728"
          onload="if(window._DEV)console.log('[Tracking] gtag.js loaded successfully');"></script>
  <script>
    gtag('js', new Date());
    gtag('config', 'AW-699207728');
    gtag('config', 'G-8X7FFQRYJS', { send_page_view: false });

    if (_DEV) {
      console.log('[Tracking] gtag configs applied. GA4 send_page_view: false — Analytics component owns all page_view events.');
    }
  </script>

  -->
